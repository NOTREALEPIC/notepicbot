<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Bot Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; }
        .card { background-color: #1E1E1E; border: 1px solid #2A2A2A; }
        .console {
            background-color: #000;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            height: 400px;
            overflow-y: scroll;
            border-radius: 5px;
            padding: 15px;
            border: 1px solid #333;
            white-space: pre-wrap;
        }
        .form-control { background-color: #2A2A2A; color: #E0E0E0; border-color: #444; }
        .form-control:focus { background-color: #333; color: #E0E0E0; border-color: #555; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">Instagram Bot Control Panel</h2>

            <!-- Step 1: Login Form -->
            <div id="login-section">
                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Test Account Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Test Account Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login & Start</button>
                </form>
            </div>

            <!-- Step 2: 2FA Verification Form (hidden by default) -->
            <div id="challenge-section" class="d-none">
                <p class="text-warning" id="challenge-message"></p>
                <form id="challenge-form">
                    <div class="mb-3">
                        <label for="code" class="form-label">6-Digit Verification Code</label>
                        <input type="text" class="form-control" id="code" required maxlength="6" pattern="[0-9]{6}">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Verify Code</button>
                </form>
            </div>

            <!-- Step 3: Live Console Log -->
            <div class="mt-4">
                <label class="form-label">Live Log:</label>
                <div id="console-log" class="console">&gt; Waiting for login...</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginSection = document.getElementById('login-section');
            const challengeSection = document.getElementById('challenge-section');
            const consoleLog = document.getElementById('console-log');
            let username = '';

            function logToConsole(message) {
                consoleLog.innerHTML += `\n&gt; ${message}`;
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                logToConsole("Attempting login...");

                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();

                if (result.success) {
                    logToConsole(result.message);
                    loginSection.classList.add('d-none');
                    startEventSource();
                } else if (result.challenge_required) {
                    logToConsole(result.message);
                    document.getElementById('challenge-message').textContent = result.message;
                    loginSection.classList.add('d-none');
                    challengeSection.classList.remove('d-none');
                } else {
                    logToConsole(`ERROR: ${result.error}`);
                }
            });

            document.getElementById('challenge-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const code = document.getElementById('code').value;
                logToConsole(`Submitting verification code...`);
                
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, username })
                });
                const result = await response.json();

                if (result.success) {
                    logToConsole(result.message);
                    challengeSection.classList.add('d-none');
                    startEventSource();
                } else {
                    logToConsole(`ERROR: ${result.error}`);
                }
            });

            function startEventSource() {
                const eventSource = new EventSource('/start-bot-actions');
                logToConsole("Connection to bot established. Waiting for logs...");
                
                eventSource.onmessage = (event) => {
                    logToConsole(event.data);
                    if (event.data.includes("BOT FINISHED")) {
                        eventSource.close();
                        logToConsole("Connection closed.");
                    }
                };
                eventSource.onerror = (err) => {
                    logToConsole("Connection error. The process may have finished.");
                    eventSource.close();
                };
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get all the HTML elements we need to interact with
            const loginSection = document.getElementById('login-section');
            const loginForm = document.getElementById('login-form');
            const challengeSection = document.getElementById('challenge-section');
            const challengeForm = document.getElementById('challenge-form');
            const consoleLog = document.getElementById('console-log');
            const challengeMessage = document.getElementById('challenge-message');
            
            // This variable will hold the username after the first step
            let currentUsername = '';

            // A helper function to print messages to our web console
            function logToConsole(message) {
                // Sanitize the message to prevent HTML injection issues
                const sanitizedMessage = message.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                consoleLog.innerHTML += `\n&gt; ${sanitizedMessage}`;
                // Automatically scroll to the latest message
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }

            // --- Event Listener for the Login Form ---
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Prevent the page from reloading
                
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                
                currentUsername = usernameInput.value;
                const password = passwordInput.value;
                
                logToConsole("Attempting login...");
                
                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: currentUsername, password: password })
                    });

                    // We need to check if the server responded with an error (like 500)
                    if (!response.ok) {
                        logToConsole(`ERROR: Server responded with status ${response.status}. Check Render logs.`);
                        const errorText = await response.text();
                        logToConsole(`Server message: ${errorText}`);
                        return;
                    }

                    const result = await response.json(); // Get the JSON data from the server

                    if (result.success) {
                        logToConsole(result.message);
                        loginSection.classList.add('d-none'); // Hide login form
                        startEventSource(); // Start the bot actions
                    } else if (result.challenge_required) {
                        logToConsole(result.message);
                        challengeMessage.textContent = result.message;
                        loginSection.classList.add('d-none'); // Hide login form
                        challengeSection.classList.remove('d-none'); // SHOW THE 2FA FORM
                    } else {
                        logToConsole(`ERROR: ${result.error}`);
                    }
                } catch (error) {
                    logToConsole(`A critical network error occurred: ${error}. Cannot connect to the server.`);
                }
            });

            // --- Event Listener for the 2FA Code Form ---
            challengeForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const codeInput = document.getElementById('code');
                const code = codeInput.value;

                logToConsole(`Submitting verification code...`);
                
                try {
                    const response = await fetch('/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code, username: currentUsername })
                    });
                    
                    if (!response.ok) {
                        logToConsole(`ERROR: Server responded with status ${response.status}.`);
                        return;
                    }

                    const result = await response.json();

                    if (result.success) {
                        logToConsole(result.message);
                        challengeSection.classList.add('d-none'); // Hide 2FA form
                        startEventSource(); // Start the bot actions
                    } else {
                        logToConsole(`ERROR: ${result.error}`);
                    }
                } catch (error) {
                    logToConsole(`A critical network error occurred: ${error}.`);
                }
            });

            // --- Function to start listening for live logs ---
            function startEventSource() {
                const eventSource = new EventSource('/start-bot-actions');
                logToConsole("Connection established. Waiting for bot logs...");
                
                eventSource.onmessage = (event) => {
                    logToConsole(event.data);
                    if (event.data.includes("BOT FINISHED")) {
                        eventSource.close();
                        logToConsole("Connection closed by server.");
                    }
                };
                
                eventSource.onerror = (err) => {
                    logToConsole("Connection error. The process may have finished or timed out.");
                    eventSource.close();
                };
            }
        });
    </script>
</body>
</html>
